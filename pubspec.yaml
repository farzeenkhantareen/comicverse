name: comicverse
description: "ComicVerse — A premium offline comic & manga reader. Beautiful, fast, and fully offline."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local Storage
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  carousel_slider: ^5.0.0
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.0

  # Utilities
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.2

  # Icons
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/comics/metadata/
    - assets/covers/
    - assets/images/
    - assets/comics/pepper/ch1/
    - assets/comics/nebula/ch1/
